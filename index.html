<!DOCTYPE html>

<body>
    <div class="game-container">

        <div class="game-controls">

            <div id="aiDifficultyControl" style="display: none;">

        </div>

        <div class="donation-section">
            <button id="donateBtn" class="donate-button">⚡ Donate with Bitcoin Lightning</button>
            <div id="donationModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Donate with Bitcoin Lightning</h2>
                    <div class="preset-amounts">
                        <button class="preset-btn" data-amount="100">100 sats</button>
                        <button class="preset-btn" data-amount="500">500 sats</button>
                        <button class="preset-btn" data-amount="1000">1000 sats</button>
                    </div>
                    <p>Scan QR code or click to copy address:</p>
                    <div id="qrcode"></div>
                    <div class="lightning-address" id="lightningAddress">
                        steelybowling85@walletofsatoshi.com
                    </div>
                </div>
            </div>
        </div>

        <div class="game-board">
            <div class="cell" data-cell-index="0"></div>
            <div class="cell" data-cell-index="1"></div>
            <div class="cell" data-cell-index="2"></div>
            <div class="cell" data-cell-index="3"></div>
            <div class="cell" data-cell-index="4"></div>
            <div class="cell" data-cell-index="5"></div>
            <div class="cell" data-cell-index="6"></div>
            <div class="cell" data-cell-index="7"></div>
            <div class="cell" data-cell-index="8"></div>
        </div>

        <button id="restart">Restart Game</button>
    </div>

    <footer>
        <p>Created by [Your Name] - GitHub: <a href="https://github.com/your-username" target="_blank">your-username</a></p>
    </footer>

    <script>
        // Bech32 implementation
        const CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
        const GENERATOR = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];

        function bech32_polymod(values) {
            let chk = 1;
            for (let p = 0; p < values.length; ++p) {
                const top = chk >> 25;
                chk = (chk & 0x1ffffff) << 5 ^ values[p];
                for (let i = 0; i < 5; ++i) {
                    if ((top >> i) & 1) {
                        chk ^= GENERATOR[i];
                    }
                }
            }
            return chk;
        }

        function encodeLNURL(url) {
            try {
                console.log('Encoding URL:', url);

                // Convert string to byte array
                const data = new TextEncoder().encode(url.toLowerCase());

                // Convert to 5-bit array
                const words = [];
                for (let i = 0; i < data.length; ++i) {
                    const b = data[i];
                    for (let j = 0; j < 8; j += 5) {
                        words.push((b >> (8 - (j + 5))) & 31);
                    }
                }

                // Add checksum
                const checksum = bech32_polymod([...Array(5).fill(2), ...words, ...Array(6).fill(0)]) ^ 1;
                for (let i = 0; i < 6; ++i) {
                    words.push((checksum >> (5 * (5 - i))) & 31);
                }

                // Encode to bech32
                const result = 'lnurl' + words.map(w => CHARSET.charAt(w)).join('');
                console.log('Successfully encoded LNURL:', result);
                return result.toUpperCase();
            } catch (error) {
                console.error('LNURL encoding error:', error);
                throw error;
            }
        }

        // Check bech32 initialization before loading main script
        function loadMainScript() {
            const script = document.createElement('script');
            script.src = 'script.js';
            document.body.appendChild(script);
        }

        // Try to load main script after a short delay to ensure library is initialized
        setTimeout(loadMainScript, 1000);
    </script>
</body>
</html>
