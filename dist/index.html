<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game - built by Devin</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>
    <div class="game-container">
        <h1>Tic-Tac-Toe - built by Devin</h1>

        <div id="status-display">Player X's turn</div>

        <div class="game-controls">
            <div>
                <label>Game Mode:</label>
                <select id="gameMode">
                    <option value="PvP">Player vs Player</option>
                    <option value="PvAI">Player vs AI</option>
                </select>
            </div>
            <div id="aiDifficultyControl" style="display: none;">
                <label>AI Difficulty:</label>
                <select id="aiDifficulty">
                    <option value="Easy">Easy</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
        </div>

        <div class="donation-section">
            <button id="donateBtn" class="donate-button">⚡ Donate with Bitcoin Lightning</button>
            <div id="donationModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Donate with Bitcoin Lightning</h2>
                    <div class="preset-amounts">
                        <button class="preset-btn" data-amount="100">100 sats</button>
                        <button class="preset-btn" data-amount="500">500 sats</button>
                        <button class="preset-btn" data-amount="1000">1000 sats</button>
                    </div>
                    <p>Scan QR code or click to copy address:</p>
                    <div id="qrcode"></div>
                    <div class="lightning-address" id="lightningAddress">
                        steelybowling85@walletofsatoshi.com
                    </div>
                </div>
            </div>
        </div>

        <div class="game-board">
            <div class="cell" data-cell-index="0"></div>
            <div class="cell" data-cell-index="1"></div>
            <div class="cell" data-cell-index="2"></div>
            <div class="cell" data-cell-index="3"></div>
            <div class="cell" data-cell-index="4"></div>
            <div class="cell" data-cell-index="5"></div>
            <div class="cell" data-cell-index="6"></div>
            <div class="cell" data-cell-index="7"></div>
            <div class="cell" data-cell-index="8"></div>
        </div>

        <button id="restart">Restart Game</button>
    </div>

    <footer>
        <p>Created by [Your Name] - GitHub: <a href="https://github.com/your-username" target="_blank">your-username</a></p>
    </footer>

    <script>
        // Initialize QR code library before loading main script
        async function loadMainScript() {
            // Wait for QR code library to be available
            while (typeof qrcode !== 'function') {
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            const script = document.createElement('script');
            script.src = 'script.js';
            document.body.appendChild(script);
        }

        window.addEventListener('load', loadMainScript);
    </script>
</body>
</html>
